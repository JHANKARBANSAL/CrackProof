name: CrackProof CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Automated RAG Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RAG & Knowledge Base Test Suite
      run: |
        python test_rag_pipeline.py
        python -m unittest test_web test_candidate_profile test_panel -v

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Build and check frontend
      run: |
        npm ci
        npm run build
        node --test tests/ui-regression.mjs

    - name: Verify Web Server Initialisation
      run: |
        python -c "import server; print('Server imports cleanly and database initializes')"

  docker-build:
    name: Docker Container Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image (dry-run)
      run: |
        docker build -t crackproof:latest .
