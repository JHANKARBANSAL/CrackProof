name: CrackProof CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Automated RAG Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RAG & Knowledge Base Test Suite
      run: |
        python test_rag_pipeline.py

    - name: Verify Web Server Initialisation
      run: |
        python -c "import server; print('Server imports cleanly and database initializes')"

  docker-build:
    name: Docker Container Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build Docker image (dry-run)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: crackproof:latest
